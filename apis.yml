aid: rimac
name: Rimac
description: >-
  Rimac Group is a Croatia-based holding company bringing together exclusive
  hypercars and advanced electrification technology. Its portfolio spans Bugatti
  Rimac (the hypercar joint venture behind the all-electric Rimac Nevera),
  Rimac Technology (design, engineering and production of EV components —
  battery systems, powertrains, battery management systems and electronic
  control units supplied to OEMs including Porsche, Hyundai, BMW and others),
  and Verne (autonomous urban mobility / robotaxi). Rimac is a B2B automotive
  and electrification supplier and vehicle manufacturer; it does not currently
  operate a public developer program, API, or developer portal. This profile is
  maintained in the API Evangelist network for company/portfolio tracking.
